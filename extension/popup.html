<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reading Activity Tracker</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 400px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #333;
      }

      .container {
        padding: 20px;
      }

      .header {
        background: white;
        padding: 20px;
        border-radius: 8px 8px 0 0;
        margin-bottom: 0;
        text-align: center;
      }

      .header h1 {
        font-size: 18px;
        color: #667eea;
        margin-bottom: 5px;
      }

      .header p {
        font-size: 12px;
        color: #999;
      }

      .content {
        background: white;
        padding: 20px;
        margin-bottom: 10px;
      }

      .status {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
        padding: 10px;
        background: #f5f5f5;
        border-radius: 6px;
      }

      .status-indicator {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #4caf50;
        margin-right: 10px;
      }

      .status-text {
        font-size: 14px;
      }

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 15px;
      }

      .stat-card {
        background: #f9f9f9;
        padding: 12px;
        border-radius: 6px;
        border-left: 3px solid #667eea;
      }

      .stat-label {
        font-size: 12px;
        color: #999;
        margin-bottom: 5px;
      }

      .stat-value {
        font-size: 18px;
        font-weight: bold;
        color: #333;
      }

      .buttons {
        display: flex;
        gap: 10px;
      }

      button {
        flex: 1;
        padding: 10px 15px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
      }

      .btn-primary {
        background: #667eea;
        color: white;
      }

      .btn-primary:hover {
        background: #5568d3;
      }

      .btn-secondary {
        background: #f0f0f0;
        color: #333;
      }

      .btn-secondary:hover {
        background: #e0e0e0;
      }

      .footer {
        background: white;
        padding: 15px 20px;
        border-radius: 0 0 8px 8px;
        text-align: center;
        font-size: 11px;
        color: #999;
      }

      .links {
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      .links a {
        color: #667eea;
        text-decoration: none;
        cursor: pointer;
      }

      .links a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>📰 Reading Tracker</h1>
        <p>Track your news reading behavior</p>
      </div>

      <div class="content">
        <div class="status">
          <div class="status-indicator"></div>
          <div class="status-text">
            Extension is <strong>Active</strong> on this page
          </div>
        </div>

        <div class="stats">
          <div class="stat-card">
            <div class="stat-label">Session ID</div>
            <div class="stat-value" id="sessionId">Loading...</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Active Time</div>
            <div class="stat-value" id="activeTime">0s</div>
          </div>
        </div>

        <div class="buttons">
          <button class="btn-secondary" id="dashboardBtn">📊 Dashboard</button>
          <button class="btn-secondary" id="settingsBtn">⚙️ Settings</button>
        </div>
      </div>

      <div class="footer">
        <div class="links">
          <a id="supportLink">Support</a>
          <a id="feedbackLink">Feedback</a>
          <a id="privacyLink">Privacy</a>
        </div>
        <p style="margin-top: 10px">v1.0.0</p>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
